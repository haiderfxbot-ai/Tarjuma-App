<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TARJUMAN - Premium Order Desk</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #060b13;
            --card-bg: rgba(30, 41, 59, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --emerald-accent: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.25);
            --text-title: #ffffff;
            --text-body: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-title);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar Dynamic Navigation Panel */
        .app-header {
            background: linear-gradient(to bottom, rgba(10, 18, 32, 0.2), transparent);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-title);
            font-size: 1.2rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .back-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* Responsive Flow Layout Container */
        .order-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 110px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.4s ease-out;
        }

        /* Interactive Automation Form Card */
        .order-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--emerald-accent);
        }

        .form-input, .form-select, .form-textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--emerald-accent);
        }

        .form-select option {
            background: #0f172a;
            color: #ffffff;
        }

        .form-textarea {
            resize: none;
            height: 80px;
        }

        /* Milestone Notice Badge */
        .milestone-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--text-body);
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .milestone-badge i {
            color: var(--emerald-accent);
            font-size: 1.1rem;
            margin-top: 2px;
        }

        /* Submit Action Launcher */
        .submit-order-btn {
            background: var(--emerald-accent);
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px var(--emerald-glow);
            transition: all 0.2s;
        }

        .submit-order-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* Bottom Fixed Navigation Matrix */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(10, 18, 32, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-body);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            width: 60px;
        }

        .nav-item i { font-size: 1.2rem; }
        .nav-item.active { color: var(--emerald-accent); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='support.html'"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="header-title">Order Custom Systems</h1>
    </header>

    <main class="order-container">
        
        <form class="order-card" id="whatsappOrderForm" onsubmit="generateWhatsAppOrder(event)">
            
            <div class="form-group">
                <label class="form-label">Your Full Name</label>
                <input type="text" class="form-input" id="custName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label class="form-label">Select Project Infrastructure</label>
                <select class="form-select" id="projectType" required>
                    <option value="Custom Trading Bot Engine">Custom Trading Bot Engine</option>
                    <option value="Web Application Dashboard">Web Application Dashboard</option>
                    <option value="Mobile Application Interface">Mobile Application Interface</option>
                    <option value="Other Cryptographic Script">Other Cryptographic Script</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Estimated Budget Pool ($)</label>
                <input type="number" class="form-input" id="projectBudget" placeholder="e.g. 200" required>
            </div>

            <div class="form-group">
                <label class="form-label">Requirements & Project Summary</label>
                <textarea class="form-textarea" id="projectDetails" placeholder="Explain your core requirements briefly..." required></textarea>
            </div>

            <div class="milestone-badge">
                <i class="fa-solid fa-circle-check"></i>
                <div>
                    <strong>15% Advance Commitment Milestone:</strong> Initiating the development workflow requires a mandatory 15% upfront processing setup allocation layer.
                </div>
            </div>

            <button type="submit" class="submit-order-btn">
                <i class="fa-brands fa-whatsapp" style="font-size:1.25rem;"></i>
                <span>Confirm Order via WhatsApp</span>
            </button>

        </form>

    </main>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fa-solid fa-house-laptop"></i>
            <span>Hub</span>
        </a>
        <a href="about.html" class="nav-item">
            <i class="fa-solid fa-circle-info"></i>
            <span>About</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fa-solid fa-sliders"></i>
            <span>Settings</span>
        </a>
        <a href="support.html" class="nav-item active">
            <i class="fa-solid fa-headset"></i>
            <span>Support</span>
        </a>
    </nav>

    <script>
        function generateWhatsAppOrder(event) {
            event.preventDefault();

            // یہاں اپنا واٹس ایپ نمبر انٹر کریں (بنا پلس پلس سائن کے)
            const myWhatsAppNumber = "03495031007"; 

            const name = document.getElementById('custName').value;
            const type = document.getElementById('projectType').value;
            const budget = document.getElementById('projectBudget').value;
            const details = document.getElementById('projectDetails').value;

            // کسٹم اسٹرکچرڈ میسج جنریٹر
            const messageBody = `Hello HAIDER!%0A%0A` +
                                `*New Project Order Matrix*%0A` +
                                `--------------------------%0A` +
                                `*Client Name:* ${encodeURIComponent(name)}%0A` +
                                `*Project Structure:* ${encodeURIComponent(type)}%0A` +
                                `*Budget Pool:* $${encodeURIComponent(budget)}%0A` +
                                `*Requirements:* ${encodeURIComponent(details)}%0A%0A` +
                                `_Note: I agree to initialize the 15% advance development milestone layer._`;

            // واٹس ایپ راؤٹنگ یو آر ایل گیٹ وے
            const whatsappUrl = `https://wa.me/${myWhatsAppNumber}?text=${messageBody}`;
            
            // رن ٹائم ریڈائریکشن پاتھ اوپنر
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker Registered Successfully:', reg.scope))
                .catch(err => console.error('Service Worker Registration Failed:', err));
        });
    }
</script>
</html>
