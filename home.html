<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TARJUMAN - Translator Hub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #060b13;
            --card-bg: rgba(30, 41, 59, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --emerald-accent: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.2);
            --blue-accent: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.25);
            --text-title: #ffffff;
            --text-body: #94a3b8;
            --text-input: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-title);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top App Header Dashboard */
        .app-header {
            background: linear-gradient(to bottom, #0a1220, transparent);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 8px var(--emerald-accent));
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--emerald-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Dynamic Notification Toast */
        .system-notification-toast {
            position: fixed;
            top: 90px; left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(16, 185, 129, 0.95);
            color: #000000;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            z-index: 1000;
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .system-notification-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* App Layout Container */
        .main-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 110px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Mode Selector Engine View */
        .engine-selector {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 6px;
            display: flex;
            gap: 4px;
            backdrop-filter: blur(8px);
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-body);
            padding: 12px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .mode-btn.active {
            background: var(--emerald-accent);
            color: #000000;
            box-shadow: 0 4px 15px var(--emerald-glow);
        }

        /* Workspace Core Translation Boards */
        .io-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            backdrop-filter: blur(8px);
            transition: border-color 0.3s ease;
        }

        .io-card:focus-within {
            border-color: var(--emerald-accent);
        }

        .card-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--emerald-accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .text-area-wrapper {
            position: relative;
            width: 100%;
        }

        .source-input, .target-output {
            width: 100%;
            min-height: 120px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-input);
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
        }

        .target-output {
            color: #ffffff;
            font-weight: 500;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .chorix-font {
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #34d399;
        }

        /* Media / Control Action Bars */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .left-controls, .right-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-body);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        .control-btn:hover {
            color: var(--emerald-accent);
            border-color: var(--emerald-accent);
            background: rgba(16, 185, 129, 0.05);
        }

        .control-btn.active-mic {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            animation: pulseMic 1.5s infinite;
        }

        .control-btn.active-speaker {
            color: #ffffff;
            background: var(--blue-accent);
            border-color: var(--blue-accent);
            box-shadow: 0 0 12px var(--blue-glow);
        }

        /* Central Swap Interactive Module */
        .swap-divider {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: -6px 0;
            z-index: 5;
        }

        .swap-circle {
            background: #0b1528;
            border: 1px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .swap-circle:active {
            transform: rotate(180deg) scale(0.9);
        }

        /* Professional Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 18, 32, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-body);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 60px;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            color: var(--emerald-accent);
        }

        /* Animation Architectures */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseMic {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-brand">
            <svg class="header-logo" viewBox="0 0 100 100">
                <path d="M 50,20 L 20,50 M 50,20 L 80,50 M 50,20 L 50,80" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <h1 class="header-title">Tarjuman</h1>
        </div>
        <div style="font-size: 0.75rem; font-weight:700; color:var(--emerald-accent); background:rgba(16,185,129,0.1); padding:4px 10px; border-radius:20px;">
            HAIDER FX
        </div>
    </header>

    <div class="system-notification-toast" id="appToast">Copied to Clipboard!</div>

    <main class="main-container">
        
        <div class="engine-selector">
            <button class="mode-btn active" id="btn-urdu" onclick="setMode('urdu')">
                <i class="fa-solid fa-language"></i>
                <span>Urdu ➔ Chorix</span>
            </button>
            <button class="mode-btn" id="btn-english" onclick="setMode('english')">
                <i class="fa-solid fa-italic"></i>
                <span>English ➔ Chorix</span>
            </button>
            <button class="mode-btn" id="btn-roman" onclick="setMode('roman')">
                <i class="fa-solid fa-keyboard"></i>
                <span>Roman ➔ Chorix</span>
            </button>
        </div>

        <div class="io-card">
            <div class="card-label">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> <span id="input-label">Source Processing (Urdu)</span>
            </div>
            <div class="text-area-wrapper">
                <textarea class="source-input" id="sourceText" placeholder="Type here to translate..." oninput="executeLiveTranslation()"></textarea>
            </div>
            <div class="action-bar">
                <div class="left-controls">
                    <button class="control-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice Typing">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>
                <div class="right-controls">
                    <button class="control-btn" onclick="clearText()" title="Clear">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="swap-divider">
            <div class="swap-circle" onclick="reverseEngine()" title="Reverse Direction">
                <i class="fa-solid fa-arrows-repeat" style="color: var(--emerald-accent); font-size:1.1rem;"></i>
            </div>
        </div>

        <div class="io-card" style="border-color: rgba(16, 185, 129, 0.15);">
            <div class="card-label">
                <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="output-label">Chorix Cryptographic Output</span>
            </div>
            <div class="text-area-wrapper">
                <div class="target-output chorix-font" id="targetText" dir="auto"></div>
            </div>
            <div class="action-bar">
                <div class="left-controls">
                    <button class="control-btn" id="speakerBtn" onclick="speakOutput()" title="Listen Translation">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
                <div class="right-controls">
                    <button class="control-btn" onclick="copyTranslation()" title="Copy Translation">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                    <button class="control-btn" onclick="shareOutputViaNative()" title="Share Globally">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <i class="fa-solid fa-house-laptop"></i>
            <span>Hub</span>
        </a>
        <a href="about.html" class="nav-item">
            <i class="fa-solid fa-circle-info"></i>
            <span>About</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fa-solid fa-sliders"></i>
            <span>Settings</span>
        </a>
        <a href="support.html" class="nav-item">
            <i class="fa-solid fa-headset"></i>
            <span>Support</span>
        </a>
    </nav>

    <script>
        let currentMode = 'urdu'; 
        let isReversed = false;
        let recognition = null;

        // Core Cryptographic Chorix Encryption Matrix Map Database
        const chorixDb = [
            { urdu: "ا", roman: "A", symbol: "亼" }, { urdu: "ع", roman: "A", symbol: "亼" },
            { urdu: "ب", roman: "B", symbol: "冂" }, { urdu: "پ", roman: "P", symbol: "円" },
            { urdu: "ت", roman: "T", symbol: "丁" }, { urdu: "ط", roman: "T", symbol: "丁" },
            { urdu: "ٹ", roman: "X", symbol: "卝" }, { urdu: "س", roman: "S", symbol: "彡" },
            { urdu: "ث", roman: "S", symbol: "彡" }, { urdu: "ص", roman: "S", symbol: "彡" },
            { urdu: "ج", roman: "J", symbol: "丩" }, { urdu: "چ", roman: "C", symbol: "屮" },
            { urdu: "ح", roman: "H", symbol: "爿" }, { urdu: "ہ", roman: "H", symbol: "爿" },
            { urdu: "خ", roman: "K", symbol: "巛" }, { urdu: "د", roman: "D", symbol: "刀" },
            { urdu: "ڈ", roman: "V", symbol: "叏" }, { urdu: "ز", roman: "Z", symbol: "乙" },
            { urdu: "ذ", roman: "Z", symbol: "乙" }, { urdu: "ض", roman: "Z", symbol: "乙" },
            { urdu: "ظ", roman: "Z", symbol: "乙" }, { urdu: "ر", roman: "R", symbol: "卜" },
            { urdu: "ڑ", roman: "Y", symbol: "丫" }, { urdu: "ش", roman: "W", symbol: "山" },
            { urdu: "ف", roman: "F", symbol: "匚" }, { urdu: "ق", roman: "Q", symbol: "口" },
            { urdu: "ک", roman: "Q", symbol: "口" }, { urdu: "گ", roman: "G", symbol: "廾" },
            { urdu: "ل", roman: "L", symbol: "乚" }, { urdu: "م", roman: "M", symbol: "爪" },
            { urdu: "ن", roman: "N", symbol: "冂" }, { urdu: "و", roman: "O", symbol: "〇" },
            { urdu: "ی", roman: "E", symbol: "乂" }, { urdu: "ے", roman: "I", symbol: "乂" }
        ];

        // Full Alpha English Character Fallback Matrix
        const englishMap = {
            'A': '亼', 'B': '冂', 'C': '屮', 'D': '刀', 'E': '乂', 'F': '匚', 'G': '廾', 'H': '爿',
            'I': '乂', 'J': '丩', 'K': '巛', 'L': '乚', 'M': '爪', 'N': '冂', 'O': '〇', 'P': '円',
            'Q': '口', 'R': '卜', 'S': '彡', 'T': '丁', 'U': '〇', 'V': '叏', 'W': '山', 'X': '卝',
            'Y': '丫', 'Z': '乙'
        };

        // Initialize user preferences from LocalStorage parameters on startup
        window.addEventListener('DOMContentLoaded', () => {
            const cachedFontScale = localStorage.getItem('tarjuman-font-scale') || '22';
            document.getElementById('targetText').style.fontSize = `${cachedFontScale}px`;
        });

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            isReversed = false;
            updateLabels();
            clearText();
        }

        function updateLabels() {
            const inLabel = document.getElementById('input-label');
            const outLabel = document.getElementById('output-label');
            const targetArea = document.getElementById('targetText');
            
            if(!isReversed) {
                inLabel.innerText = `Source Processing (${currentMode.toUpperCase()})`;
                outLabel.innerText = "Chorix Cryptographic Output";
                targetArea.classList.add('chorix-font');
                targetArea.setAttribute('dir', 'auto');
            } else {
                inLabel.innerText = "Chorix Cryptographic Input";
                outLabel.innerText = `Decoded Output (${currentMode.toUpperCase()})`;
                targetArea.classList.remove('chorix-font');
                targetArea.setAttribute('dir', currentMode === 'urdu' ? 'rtl' : 'ltr');
            }
        }

        function reverseEngine() {
            isReversed = !isReversed;
            updateLabels();
            const tempValue = document.getElementById('sourceText').value;
            document.getElementById('sourceText').value = document.getElementById('targetText').innerText;
            executeLiveTranslation();
        }

        function clearText() {
            document.getElementById('sourceText').value = '';
            document.getElementById('targetText').innerText = '';
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            document.getElementById('speakerBtn').classList.remove('active-speaker');
        }

        // Live Algorithmic Character Matrix Mapping Core Loop
        function executeLiveTranslation() {
            const input = document.getElementById('sourceText').value.toUpperCase();
            let result = "";

            if (!isReversed) {
                if (currentMode === 'english') {
                    for (let char of input) {
                        result += englishMap[char] || char;
                    }
                } else if (currentMode === 'roman') {
                    for (let char of input) {
                        let record = chorixDb.find(item => item.roman === char);
                        result += record ? record.symbol : char;
                    }
                } else if (currentMode === 'urdu') {
                    for (let char of input) {
                        let record = chorixDb.find(item => item.urdu === char);
                        result += record ? record.symbol : char;
                    }
                }
            } else {
                for (let char of input) {
                    if (currentMode === 'english') {
                        let key = Object.keys(englishMap).find(k => englishMap[k] === char);
                        result += key || char;
                    } else {
                        let record = chorixDb.find(item => item.symbol === char);
                        if (record) {
                            result += (currentMode === 'urdu') ? record.urdu : record.roman;
                        } else {
                            result += char;
                        }
                    }
                }
            }
            document.getElementById('targetText').innerText = result;
        }

        // System Diagnostic Flash Feedback Alert Window
        function triggerToastAlert(msg) {
            const toast = document.getElementById('appToast');
            toast.innerText = msg;
            toast.className = "system-notification-toast show";
            setTimeout(() => {
                toast.className = "system-notification-toast";
            }, 2000);
        }

        // Advanced Clipboard Data Write Action Controller
        function copyTranslation() {
            const txt = document.getElementById('targetText').innerText;
            if(!txt.trim()) return;

            navigator.clipboard.writeText(txt).then(() => {
                triggerToastAlert("Copied to Clipboard!");
            }).catch(() => {
                alert("Failed to write to terminal clipboard parameters.");
            });
        }

        // Premium Native Multi-Platform Mobile Share API Implementation
        function shareOutputViaNative() {
            const txt = document.getElementById('targetText').innerText;
            if(!txt.trim()) return;

            if (navigator.share) {
                navigator.share({
                    title: 'TARJUMAN Output Transmission',
                    text: txt
                }).catch((err) => console.log('Share routing cancelled:', err));
            } else {
                navigator.clipboard.writeText(txt);
                triggerToastAlert("Share unsupported. Copied to Clipboard!");
            }
        }

        // Integrated Web Speech Engine Audio Output Synthesis Trigger
        function speakOutput() {
            const txt = document.getElementById('targetText').innerText;
            if(!txt.trim()) return;

            const speakerBtn = document.getElementById('speakerBtn');

            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                speakerBtn.classList.remove('active-speaker');
                return;
            }

            speakerBtn.classList.add('active-speaker');
            const utterance = new SpeechSynthesisUtterance(txt);

            if (currentMode === 'urdu' && isReversed) {
                utterance.lang = 'ur-PK';
                utterance.rate = 0.85;
            } else {
                utterance.lang = 'en-US';
                utterance.rate = 1.0;
            }

            utterance.onend = () => speakerBtn.classList.remove('active-speaker');
            utterance.onerror = () => speakerBtn.classList.remove('active-speaker');

            window.speechSynthesis.speak(utterance);
        }

        // Hardware Vocal Dictation Speech Input Recognition Controller Loop
        function toggleVoiceInput() {
            const micBtn = document.getElementById('micBtn');
            const SpeechObj = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechObj) {
                alert("Voice recognition is not supported on this platform device.");
                return;
            }

            if (recognition) {
                recognition.stop();
                return;
            }

            recognition = new SpeechObj();
            recognition.continuous = false;
            recognition.interimResults = false;
            
            if (currentMode === 'urdu') {
                recognition.lang = 'ur-PK';
            } else {
                recognition.lang = 'en-US';
            }

            recognition.onstart = () => {
                micBtn.classList.add('active-mic');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('sourceText').value = transcript;
                executeLiveTranslation();
            };

            recognition.onend = () => {
                micBtn.classList.remove('active-mic');
                recognition = null;
            };

            recognition.onerror = () => {
                micBtn.classList.remove('active-mic');
                recognition = null;
            };

            recognition.start();
        }
    </script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker Registered Successfully:', reg.scope))
                .catch(err => console.error('Service Worker Registration Failed:', err));
        });
    }
</script>
</body>
</html>
